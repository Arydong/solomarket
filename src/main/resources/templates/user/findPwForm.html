<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/nav.js"></script>
    <script src="/js/home.js"></script>
</head>
<body>

<!-- Header -->
<div th:replace="~{/layout/fragment/header :: header}"></div>

<!-- Navigation -->
<div th:replace="~{/layout/fragment/nav :: nav}"></div>

<!-- Main Content -->
<main layout:fragment="content">
    <div class="container">
        <h2>비밀번호 찾기</h2>

        <form id="findPwForm">
            <label for="userId">아이디</label>
            <input type="text" id="userId" name="userId" required><br>

            <label for="phone">전화번호</label>
            <input type="text" id="phone" name="phone" required><br>

            <button type="button" onclick="findPw()">비밀번호 찾기</button>
        </form>

        <div id="pwResult" style="margin-top: 10px; color: green;"></div>
    </div>

    <script>
        function findPw() {
            const userId = document.getElementById("userId").value;
            const phone = document.getElementById("phone").value;

            axios.post("/api/user/find-pw", { userId, phone })
                .then(res => {
                    document.getElementById("pwResult").innerText = res.data;
                })
                .catch(err => {
                    document.getElementById("pwResult").innerText = "비밀번호를 찾을 수 없습니다.";
                });
        }
    </script>
</main>

<!-- Footer -->
<div th:replace="~{/layout/fragment/footer :: footer}"></div>

</body>
</html>
