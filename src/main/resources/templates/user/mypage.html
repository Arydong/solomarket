<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mypage.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/home.js"></script>
    <script src="/js/mypage.js" defer></script>
</head>
<body>
<div th:replace="~{/layout/fragment/header :: header}"></div>
<div th:replace="~{/layout/fragment/nav :: nav}"></div>

<div class="layout-wrapper">
    <!-- Aside 영역 -->
    <aside layout:fragment="aside">
        <div>
            <a href="/user/mypage">내 정보</a><br>
            <a href="/product/list">판매내역</a><br>
            <a href="#">개인정보 수정</a>
        </div>
    </aside>

    <!-- 본문 영역 -->
    <main layout:fragment="content">
        <div class="container">
            <div class="profile-box">
                <div class="profile-info">
                    <h2 th:text="${nickname} + '님의 페이지입니다.'"></h2>
                </div>
            </div>

            <div class="summary-cards">
                <div class="summary-card">
                    <h3>판매내역</h3>
                    <a href="/product/list"><p id="sales-count" th:text="${salesCount + '건'}"></p></a>
                </div>
                <div class="summary-card">
                    <h3>구매내역</h3>
                    <p id="purchase-count">0건</p>
                </div>
                <div class="summary-card">
                    <h3>평점</h3>
                    <p id="rating">0점</p>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{/layout/fragment/footer :: footer}"></div>
<div layout:fragment="scripts"></div>
</body>
</html>
