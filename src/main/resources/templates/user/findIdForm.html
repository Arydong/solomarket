<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>아이디 찾기</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/nav.js"></script>
    <script src="/js/home.js"></script>
</head>
<body>

<!-- Header -->
<div th:replace="~{/layout/fragment/header :: header}"></div>

<!-- Navigation -->
<div th:replace="~{/layout/fragment/nav :: nav}"></div>

<!-- Main Content -->
<main layout:fragment="content">
    <div class="container">
        <h2>아이디 찾기</h2>

        <form id="findIdForm">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" required><br>

            <label for="phone">전화번호</label>
            <input type="text" id="phone" name="phone" required><br>

            <button type="button" onclick="findId()">아이디 찾기</button>
        </form>

        <div id="result" style="margin-top: 10px; color: blue;"></div>
    </div>

    <script>
        function findId() {
            const name = document.getElementById("name").value;
            const phone = document.getElementById("phone").value;

            axios.post("/api/user/find-id", {
                userName: name,
                phone: phone
            })
                .then(res => {
                    document.getElementById("result").innerText = "찾고자 하시는 아이디는 : " + res.data + " 입니다.";
                })
                .catch(err => {
                    document.getElementById("result").innerText = "아이디를 찾을 수 없습니다.";
                });
        }
    </script>
</main>

<!-- Footer -->
<div th:replace="~{/layout/fragment/footer :: footer}"></div>

</body>
</html>
