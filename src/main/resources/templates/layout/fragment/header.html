<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>header</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header th:fragment="header">
    <div id="header_container">
        <div id="header_left">
            <a href="/">
                <img src="/images/logo2.png" alt="로고사진" style="max-width: 250px; max-height: 150px">
            </a>
        </div>
        <div id="header_center">
            <input type="text" placeholder="구매하고자 하는 물품을 검색해보세요" autocomplete="on">
        </div>
        <div id="header_right">
            <a href="#" id="chat-link">채팅내역</a> |
            <a href="#" id="sell-item-link">판매하기</a> |
            <div id="user-menu-container" style="position: relative; display: inline-block;">
                <a href="#" id="mypage-link">마이페이지</a>
                <div id="user-dropdown" style="display: none; position: absolute; top: 25px; right: 0; background: white; border: 1px solid #ccc; box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 999;">
                    <a href="/user/mypage" style="display: block; padding: 10px; white-space: nowrap;">마이페이지</a>
                    <a href="/logout" style="display: block; padding: 10px; white-space: nowrap;">로그아웃</a>
                </div>
            </div>
        </div>
    </div>
</header>
</body>
</html>
