<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><meta charset="UTF-8">
  <title>공통 레이아웃 with Aside</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/nav.js"></script>
  <script src="/js/home.js"></script>
</head>
<body>
<div th:replace="~{/layout/fragment/header :: header}"></div>

<div th:replace="~{/layout/fragment/nav :: nav}"></div>

<div class="layout-wrapper">
  <aside layout:fragment="aside">
    <!--사이드 내용-->
  </aside>
  <main layout:fragment="content"><div class="container"></div>
  <!--본문 내용-->
  </main>
</div>

<div th:replace="~{/layout/fragment/footer :: footer}"></div>

<div layout:fragment="scripts"></div>

</body>
</html>
