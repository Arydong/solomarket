<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>검색 결과</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/home.js"></script>
</head>
<body>

<!-- Header -->
<div th:replace="~{/layout/fragment/header :: header}"></div>

<!-- Navigation -->
<div th:replace="~{/layout/fragment/nav :: nav}"></div>

<!-- Main Content -->
<main layout:fragment="content">
    <div class="container">
        <div th:if="${#lists.isEmpty(products)}">
            <p>검색 결과가 없습니다.</p>
        </div>

        <div class="card-grid" th:if="${!#lists.isEmpty(products)}">
            <div th:each="product : ${products}" class="product-card"
                 th:onclick="|location.href='/product/' + ${product.productNo}|"
                 style="cursor: pointer; border: 1px solid #ddd; padding: 15px; margin: 10px; width: 200px; display: inline-block; vertical-align: top; text-align: center;">

                <img th:src="${product.fileUrl}" alt="상품 이미지" style="max-width: 100%; height: 150px; object-fit: cover;">
                <h2 th:text="${product.title}" style="font-size: 18px; margin-top: 10px;"></h2>
                <p th:text="${product.price} + ' 원'" style="font-size: 16px; color: #333;"></p>
                <p th:text="${product.category}" style="font-size: 14px; color: #777;"></p>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{/layout/fragment/footer :: footer}"></div>

</body>
</html>
