<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>물품 상세</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/nav.js"></script>
    <script src="/js/home.js"></script>
</head>
<body>

<!-- Header -->
<div th:replace="~{/layout/fragment/header :: header}"></div>

<!-- Navigation -->
<div th:replace="~{/layout/fragment/nav :: nav}"></div>

<!-- Main Content -->
<main layout:fragment="content">
    <div class="container">
        <h1 th:text="${product.title}">상품명</h1>
        <p><strong>상태</strong>
            <span th:switch="${product.situation}">
                <span th:case="'Y'">판매중</span>
                <span th:case="'W'">예약중</span>
                <span th:case="'P'">거래종료</span>
            </span>
        </p>
        <img th:src="${product.fileUrl}" alt="상품 이미지" style="max-width:300px;">
        <button id="wishlist-btn" type="button"
                th:attr="data-product-no=${product.productNo}">
            <span id="wishlist-icon" th:text="${isWished} ? '❤️' : '🤍'"></span>
        </button>
        <p><strong>판매자 : </strong><span th:text="${product.nickname}"></span></p>
        <button type="button" class="report-btn"
                th:if="${loginUserNo != null}"
                th:data-user-no="${product.sellerId}"
                onclick="reportUser(this)">
            신고
        </button>
        <p><strong>등록일:</strong> <span th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd')}"></span></p>
        <p><strong>가격:</strong> <span th:text="${product.price}"></span> 원</p>
        <p><strong>설명:</strong></p>
        <p th:text="${product.content}"></p>
        <p><strong>카테고리:</strong> <span th:text="${product.category}"></span></p>

        <div class="chat-btn-wrapper"
             th:if="${loginUserNo != null and loginUserNo != product.sellerId}">
            <form th:action="@{/chat/room}" method="post">
                <input type="hidden" name="productNo" th:value="${product.productNo}" />
                <input type="hidden" name="sellerId" th:value="${product.sellerId}" />
                <button type="submit" class="chat-btn">💬 채팅하기</button>
            </form>
        </div>

        <!-- 본인일 경우 안내 문구 -->
        <div th:if="${loginUserNo != null and loginUserNo == product.sellerId}">
            <!-- 수정 버튼 -->
            <form th:action="@{/product/update}" method="get" style="display: inline;">
                <input type="hidden" name="productNo" th:value="${product.productNo}" />
                <button type="submit" class="edit-btn">✏️ 수정</button>
            </form>

            <!-- 삭제 버튼 -->
            <form id="deleteForm" th:action="@{/product/delete}" method="post" style="display: inline;">
                <input type="hidden" name="productNo" th:value="${product.productNo}" />
                <button type="button" class="delete-btn" onclick="confirmDelete()">🗑️ 삭제</button>
            </form>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{/layout/fragment/footer :: footer}"></div>
<script>
    function confirmDelete(){
        if(confirm('정말 삭제하시겠습니까?')){
            document.getElementById('deleteForm').submit();
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        const wishlistBtn = document.getElementById("wishlist-btn");
        const wishlistIcon = document.getElementById("wishlist-icon");

        wishlistBtn.addEventListener("click", function () {
            const productNo = wishlistBtn.getAttribute("data-product-no");

            axios.post("/api/wishlist/toggle", { productNo: productNo })
                .then(response => {
                    if (response.data.wished) {
                        wishlistIcon.textContent = "❤️";
                    } else {
                        wishlistIcon.textContent = "🤍";
                    }
                    alert("찜 목록에 등록되었습니다.")
                })
                .catch(error => {
                    console.error(error);
                    alert("찜 처리 중 오류가 발생했습니다.");
                });
        });
    });
    function reportUser(button) {
        const reportedUserNo = button.getAttribute('data-user-no');

        if (confirm('이 사용자를 신고하시겠습니까?')) {
            axios.post('/report/user', {
                userNo: reportedUserNo
            })
                .then(response => {
                    alert('신고가 접수되었습니다.');
                    location.reload();
                })
                .catch(error => {
                    alert('신고 실패: ' + error.response.data);
                });
        }
    }
</script>
</body>
</html>
