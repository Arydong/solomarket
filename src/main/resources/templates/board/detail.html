<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/detailBoard.css">
    <link rel="stylesheet" href="/css/comment.css">
    <script src="/js/nav.js"></script>
    <script src="/js/home.js"></script>
</head>
<body>

<!-- Header -->
<div th:replace="~{/layout/fragment/header :: header}"></div>

<!-- Navigation -->
<div th:replace="~{/layout/fragment/nav :: nav}"></div>

<main layout:fragment="content">
    <div class="container">
        <section class="board-detail">
            <h1 th:text="${board.title}">제목</h1>
            <p>
                작성자: <span th:text="${board.nickname}"></span><br>
                조회수: <span th:text="${board.viewCount}"></span><br>
                작성일: <span th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd')}"></span>
            </p>
            <div th:text="${board.content}" class="board-content">본문</div>

            <div th:if="${loginUserNo != null and loginUserNo == board.userNo}" class="board-actions">
                <form th:action="@{/board/update}" method="get" style="display:inline;">
                    <input type="hidden" name="boardId" th:value="${board.boardId}"/>
                    <button type="submit">수정</button>
                </form>
                <form th:action="@{/board/delete}" method="post" style="display:inline;">
                    <input type="hidden" name="boardId" th:value="${board.boardId}"/>
                    <button type="submit" onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
                </form>
            </div>
        </section>

        <section class="comment-section">
            <h2>댓글</h2>
            <div id="comment-list">
                <div th:if="${loginUserNo != null}" class="comment-form">
                    <form id="commentForm">
                        <input type="hidden" id="boardId" th:value="${board.boardId}">
                        <textarea id="commentContent" placeholder="댓글을 입력하세요" required></textarea><br>
                        <button type="submit">댓글 작성</button>
                    </form>
                </div>

                <div th:each="comment : ${commentTree}">
                    <div style="margin-left: [[${comment.depth}]]0px;">
                        <p>
                            <span th:text="${comment.nickname}"></span>
                            <span th:if="${comment.userNo == board.userNo}"
                                  style="font-weight:bold; color:blue;">(작성자)</span>
                            : <span th:text="${comment.content}"></span>
                            <small th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
                            <button type="button" class="reply-btn"
                                    th:if="${loginUserNo != null}"
                                    th:data-comment-id="${comment.commentId}">
                                답글
                            </button>
                            <button type="button" class="delete-btn"
                                    th:if="${loginUserNo == comment.userNo}"
                                    th:data-comment-id="${comment.commentId}"
                                    onclick="deleteComment(this)">
                                X
                            </button>
                        </p>

                        <div th:if="${#lists.size(comment.children) > 0}">
                            <div th:each="child : ${comment.children}" style="margin-left: 30px;">
                                <p>
                                    ↳ <span th:text="${child.nickname}"></span>
                                    <span th:if="${child.userNo == board.userNo}" style="font-weight:bold; color:blue;">(작성자)</span>
                                    : <span th:text="${child.content}"></span>
                                    <small th:text="${#temporals.format(child.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
                                </p>

                                <div class="reply-form-container" id="reply-form-[[${child.commentId}]]"
                                     style="display:none; margin-left:30px;">
                                    <textarea class="reply-content" placeholder="답글을 입력하세요"></textarea><br>
                                    <button type="button" class="submit-reply-btn"
                                            th:data-parent-id="${child.commentId}">답글 작성
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{/layout/fragment/footer :: footer}"></div>

<script src="/js/comment.js"></script>
</body>
</html>
